# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   Start Ollama server only:
#     docker compose up -d ollama
#
#   Build .vsix (output → ./dist/):
#     docker compose run --rm builder
#
#   Start Ollama + pull a model interactively:
#     docker compose up -d ollama
#     docker compose exec ollama ollama pull llama3
#
#   Tear down:
#     docker compose down
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Ollama inference server ───────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    ports:
      - "11434:11434"           # VS Code extension connects here by default
    volumes:
      - ollama-data:/root/.ollama  # persist downloaded models between restarts
    restart: unless-stopped
    # GPU support (uncomment if your host has NVIDIA GPU + nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── General npm runner (e.g. npm run health / check:unused / compile) ────
  npm:
    image: node:20-slim
    working_dir: /workspace
    volumes:
      - .:/workspace              # mount project root
    entrypoint: ["npm"]
    command: ["run", "health"]   # override at runtime: docker compose run --rm npm run check:unused

  # ── Extension builder (produces ./dist/ollama-chat.vsix) ─────────────────
  builder:
    image: node:20-slim
    working_dir: /workspace
    volumes:
      - .:/workspace              # mount project root
    command: >
      sh -c "apt-get update -qq && apt-get install -y --no-install-recommends git > /dev/null 2>&1 &&
             npm install --no-audit --no-fund &&
             npm run compile &&
             mkdir -p /workspace/dist &&
             npm run package"
    profiles:
      - build                    # only runs when explicitly requested

volumes:
  ollama-data:
