# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   Start Ollama server only:
#     docker compose up -d ollama
#
#   Build .vsix (output → ./dist/):
#     docker compose run --rm builder
#
#   Start Ollama + pull a model interactively:
#     docker compose up -d ollama
#     docker compose exec ollama ollama pull llama3
#
#   Tear down:
#     docker compose down
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Ollama inference server ───────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    ports:
      - "11434:11434"           # VS Code extension connects here by default
    volumes:
      - ollama-data:/root/.ollama  # persist downloaded models between restarts
    restart: unless-stopped
    # GPU support (uncomment if your host has NVIDIA GPU + nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── General npm runner (e.g. npm run health / check:unused / compile) ────
  npm:
    image: node:20-slim
    working_dir: /workspace
    volumes:
      - .:/workspace              # mount project root
    entrypoint: ["npm"]
    command: ["run", "health"]   # override at runtime: docker compose run --rm npm run check:unused

  # ── Extension builder (produces ./dist/ollama-chat.vsix) ─────────────────
  builder:
    image: node:20-slim
    working_dir: /workspace
    volumes:
      - .:/workspace              # mount project root
    command: >
      sh -c "apt-get update -qq && apt-get install -y --no-install-recommends git > /dev/null 2>&1 &&
             npm install --no-audit --no-fund &&
             npm run compile &&
             mkdir -p /workspace/dist &&
             npm run package"
    profiles:
      - build                    # only runs when explicitly requested

  # ── Tailscale VPN node ────────────────────────────────────────────────────
  # Start:   docker compose --profile tailscale up -d tailscale
  # Auth:    TS_AUTHKEY=tskey-auth-xxx docker compose --profile tailscale up -d tailscale
  # Status:  docker compose exec tailscale tailscale status
  # Logs:    docker compose logs -f tailscale
  #
  # --tun=userspace-networking lets the daemon run without /dev/net/tun or
  # privileged mode; suitable for most cases.  Remove it and add the
  # cap_add / devices blocks below if you need kernel-level routing.
  tailscale:
    build:
      context: ./scripts
      dockerfile: Dockerfile.tailscale
    container_name: tailscale-node
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}           # set on the host or in .env
      - TS_HOSTNAME=${TS_HOSTNAME:-amiclaw-node}
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:-}
    volumes:
      - tailscale-state:/var/lib/tailscale   # persist auth across restarts
    restart: unless-stopped
    profiles:
      - tailscale
    # Uncomment if you need kernel tun instead of userspace networking:
    # cap_add:
    #   - NET_ADMIN
    #   - SYS_MODULE
    # devices:
    #   - /dev/net/tun:/dev/net/tun

volumes:
  ollama-data:
  tailscale-state:
